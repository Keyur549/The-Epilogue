<style>
:root{--bg:#f4f0ff;--card:#fff;--ink:#2a2150;--muted:#7a7498;--accent:#7c3aed;--accent2:#f59e0b;--sky:#38bdf8;--green:#16a34a;--red:#dc2626;--yellow:#eab308;--line:#e2daf8;}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#141220;--card:#1f1d2e;--ink:#f1f0f6;--muted:#a1a1b5;--line:#33314a;}}
*{box-sizing:border-box;} body{margin:0;background:var(--bg);color:var(--ink);font-family:'Segoe UI',system-ui,sans-serif;}
.wrap{max-width:640px;margin:0 auto;padding:20px 16px 40px;}
h1{font-size:1.3rem;} h2{font-size:1.05rem;color:var(--accent);}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0;}
.btn{display:inline-block;background:var(--accent);color:#fff;border:none;border-radius:10px;padding:10px 16px;font-weight:600;cursor:pointer;margin:4px 6px 4px 0;}
.btn.secondary{background:var(--accent2);} .btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent);}
.btn:disabled{opacity:.4;cursor:not-allowed;}
input,select{width:100%;padding:9px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);margin:4px 0 10px;}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin:10px 0;}
.cell{position:relative;aspect-ratio:1;display:flex;align-items:center;justify-content:center;text-align:center;font-size:.8rem;font-weight:600;padding:3px;border-radius:8px;border:1px solid var(--line);background:var(--bg);cursor:pointer;overflow:hidden;}
.cell .badge{position:absolute;top:2px;right:3px;font-size:.55rem;font-weight:700;background:rgba(0,0,0,.35);color:#fff;border-radius:6px;padding:0 3px;}
.cell .ln{position:absolute;bottom:2px;left:3px;font-size:.55rem;font-weight:800;background:#f59e0b;color:#3b2a00;border-radius:6px;padding:0 4px;max-width:92%;white-space:nowrap}.cell.inline{box-shadow:inset 0 0 0 2px #f59e0b}
.cell.dim{opacity:.18}
.cell.hint{outline:3px solid #f59e0b;box-shadow:0 0 10px #f59e0b;animation:cpg 1.2s infinite alternate}
.cell .lk{position:absolute;bottom:1px;right:3px;font-size:.6rem}.cell .fx{position:absolute;top:1px;left:3px;font-size:.8rem;opacity:.55}.cell .fx.hit{opacity:1;filter:drop-shadow(0 0 4px #fff)}
.cell .pt{position:absolute;bottom:1px;right:3px;font-size:.6rem;font-weight:900;background:rgba(0,0,0,.5);color:#fff;border-radius:6px;padding:0 3px}.cell .pt.p{background:#064e3b}.cell .pt.m{background:#7f1d1d}
.zlive{background:#e0f2fe;color:#0c4a6e;border-radius:10px;padding:7px 10px;margin:6px 0;font-weight:700;font-size:.88rem}.zlive small{display:block;font-weight:600;opacity:.8}.zbar{height:8px;border-radius:6px;background:#bae6fd;margin:5px 0;overflow:hidden}.zbar i{display:block;height:100%;background:#0284c7}
.zgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin:8px 0}.zc{position:relative;aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-size:.68rem;font-weight:600;padding:2px;border-radius:7px;border:1px solid var(--line);background:var(--bg);overflow:hidden}.zc em{font-style:normal;font-size:.62rem;font-weight:800}.zc.zok{background:var(--green);color:#fff}.zc.zno{background:var(--red);color:#fff}
.zsum{background:#fff7d6;border:2px solid #f59e0b;border-radius:12px;padding:8px 10px;color:#3b2a00;font-weight:600;font-size:.88rem}
.runbar{text-align:center;font-weight:700}
.zc.zk{background:var(--sky);color:#fff;font-size:.68rem}.zc .zl{font-style:normal;font-size:.95rem;line-height:1;display:block;margin-top:1px}.zov{position:fixed;inset:0;z-index:60;background:rgba(10,8,25,.6);overflow:auto;padding:12px}.zin{max-width:560px;margin:0 auto}.zline{background:#e0f2fe;color:#0c4a6e;border-radius:10px;padding:6px 9px;margin:5px 0;font-weight:700;font-size:.85rem}.zbtn{display:flex;justify-content:space-between;align-items:center;width:100%;background:linear-gradient(135deg,#0ea5e9,#7c3aed);color:#fff;border:0;border-radius:12px;padding:11px 14px;font-weight:800;font-size:.95rem;margin:8px 0;cursor:pointer}.bk{max-width:340px;margin:8px auto 0;text-align:left}.bk div{display:flex;justify-content:space-between;gap:10px;padding:3px 0;border-bottom:1px dashed #9ca3af;font-size:.9rem}.bk .sub{font-weight:900;border-bottom:2px solid #6b7280}

.pwr{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin:6px 0}.cell.hint{outline:3px solid #f59e0b;box-shadow:0 0 10px #f59e0b;animation:cpg 1.2s infinite alternate}@keyframes cpg{to{box-shadow:0 0 18px #fbbf24}}.cpy{background:#fff7d6;border:2px solid #f59e0b;border-radius:12px;padding:8px 10px;margin:6px 0;color:#3b2a00;font-weight:700;font-size:.9rem}.cpy i{font-style:normal;float:right;font-weight:900}
.pwr button{font:inherit;font-size:.7rem;font-weight:800;border-radius:12px;padding:6px 2px;border:2px solid #f59e0b;background:linear-gradient(160deg,#fff7d6,#fde68a);color:#3b2a00;line-height:1.25;cursor:pointer}
.pwr button b{display:block;font-size:1.25rem}
.pwr button.used{opacity:.4;filter:grayscale(.8);border-style:dashed}.pwr button.act{background:linear-gradient(160deg,#a78bfa,#7c3aed);color:#fff;border-color:#fff;box-shadow:0 0 0 3px #f59e0b}
.pwr button:disabled{opacity:.45;cursor:not-allowed}
.stk{display:flex;align-items:center;justify-content:center;gap:6px;margin:4px 0;font-weight:800;font-size:.8rem}.stk i{font-style:normal;width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:#e5e7eb;color:#555;font-size:.8rem}.stk i.ok{background:#16a34a;color:#fff}.stk i.cur{background:#f59e0b;color:#3b2a00}.stk i.miss{background:#9ca3af;color:#fff}
.pmsg{text-align:center;font-size:.8rem;font-weight:700;border-radius:10px;padding:5px 8px;margin:4px 0;background:#fff3b0;color:#4a3a00}
.cell.marked{background:var(--sky);color:#fff;} .cell.green{background:var(--green);color:#fff;} .cell.red{background:var(--red);color:#fff;} .cell.yellow{background:var(--yellow);color:#332600;}
.timer{font-size:2rem;font-weight:800;color:var(--red);}
.qtext{font-size:1.05rem;font-weight:600;background:var(--bg);padding:10px;border-radius:10px;}
.muted{color:var(--muted);font-size:.85rem;}
.overflow{overflow-x:auto;} ul{padding-left:18px;}
.stbl{width:100%;font-size:.78rem;border-collapse:collapse;border:1px solid var(--line);}
.stbl th,.stbl td{border:1px solid var(--line);padding:7px 8px;text-align:left;}
.stbl th{background:var(--accent);color:#fff;font-weight:700;position:sticky;top:0;}
.stbl tr:nth-child(even) td{background:rgba(124,58,237,.06);}
.stbl td.ok{color:var(--green);font-weight:700;} .stbl td.bad{color:var(--red);font-weight:700;}
@keyframes popS{0%{transform:scale(.85)}100%{transform:scale(1)}}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
.big-winner{position:relative;overflow:hidden;text-align:center;background:linear-gradient(160deg,var(--accent),var(--accent2));color:#fff;padding:34px 12px;border-radius:18px;
  box-shadow:0 0 0 3px rgba(255,215,0,.55), 0 0 40px 8px rgba(255,215,0,.35); animation:popS .6s ease-out, glowPulse 1.8s ease-in-out infinite;}
.big-winner::before{content:'';position:absolute;top:0;left:-60%;width:40%;height:100%;
  background:linear-gradient(120deg,transparent,rgba(255,255,255,.4),transparent);transform:skewX(-20deg);animation:sweep 2.6s ease-in-out infinite;pointer-events:none;}
.big-winner .crown{font-size:3.2rem;animation:crownPulse 1.3s ease-in-out infinite;display:inline-block;}
.big-winner .win-cat{font-size:2.3rem;font-weight:900;letter-spacing:1.5px;text-transform:uppercase;margin-top:4px;
  background:linear-gradient(90deg,#fff6c8,#ffd700,#fff6c8);background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow:0 0 22px rgba(255,215,0,.55); animation:shimmer 2s linear infinite;}
.big-winner .win-avatar{font-size:4.2rem;margin-top:10px;animation:popS .8s ease-out;}
.big-winner .win-name{font-size:2.1rem;font-weight:800;margin-top:4px;} .big-winner .win-zone{font-size:1.1rem;opacity:.92;}
.spark{position:absolute;font-size:1.3rem;animation:twinkle 1.6s ease-in-out infinite;pointer-events:none;}
@keyframes shimmer{to{background-position:-200% center;}}
@keyframes crownPulse{0%,100%{transform:scale(1) rotate(-5deg);}50%{transform:scale(1.18) rotate(5deg);}}
@keyframes sweep{0%{left:-60%;}100%{left:130%;}}
@keyframes glowPulse{0%,100%{box-shadow:0 0 0 3px rgba(255,215,0,.55),0 0 40px 8px rgba(255,215,0,.32);}50%{box-shadow:0 0 0 3px rgba(255,215,0,.85),0 0 60px 14px rgba(255,215,0,.55);}}
@keyframes twinkle{0%,100%{opacity:.2;transform:scale(.7) rotate(0deg);}50%{opacity:1;transform:scale(1.25) rotate(20deg);}}
.winmini{position:relative;overflow:hidden;border-radius:14px;padding:14px 6px;text-align:center;
  animation:popS .5s ease-out, glowPulse 1.8s ease-in-out infinite;
  box-shadow:0 0 0 2px rgba(255,215,0,.6), 0 0 16px 3px rgba(255,215,0,.35);}
.winmini::before{content:'';position:absolute;top:0;left:-60%;width:40%;height:100%;
  background:linear-gradient(120deg,transparent,rgba(255,255,255,.35),transparent);transform:skewX(-20deg);animation:sweep 2.6s ease-in-out infinite;pointer-events:none;}
.winmini .mcrown{font-size:1.3rem;animation:crownPulse 1.3s ease-in-out infinite;display:inline-block;}
.winmini .mlbl{font-size:.72rem;font-weight:900;letter-spacing:.5px;text-transform:uppercase;
  background:linear-gradient(90deg,#fff6c8,#ffd700,#fff6c8);background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;
  animation:shimmer 2.4s linear infinite;}
.winmini .mav{font-size:2rem;margin:4px 0 2px;animation:popS .8s ease-out;} .winmini .mnm{font-size:1.1rem;font-weight:800;color:#fff;} .winmini .mzn{font-size:.7rem;color:rgba(255,255,255,.85);}
.winmini .mspark{position:absolute;font-size:.9rem;animation:twinkle 1.6s ease-in-out infinite;pointer-events:none;}
.numpop{text-align:center;background:linear-gradient(160deg,#7c3aed,#f59e0b);color:#fff;border-radius:22px;padding:30px 20px;
  box-shadow:0 0 0 3px rgba(255,215,0,.6), 0 0 50px 10px rgba(255,215,0,.4); animation:popBig .45s cubic-bezier(.17,.89,.32,1.49);}
.numpop .lbl{font-size:1.1rem;font-weight:700;letter-spacing:1px;opacity:.9;text-transform:uppercase;}
.numpop .num{font-size:5rem;font-weight:900;line-height:1.1;text-shadow:0 0 24px rgba(255,255,255,.6);}
@keyframes popBig{0%{transform:scale(.3);opacity:0;}70%{transform:scale(1.12);opacity:1;}100%{transform:scale(1);}}

#scov{position:fixed;inset:0;z-index:9999;background:rgba(15,10,40,.88);display:flex;align-items:center;justify-content:center;padding:14px}
#scbox{width:100%;max-width:380px;text-align:center;color:#fff}
#scwrap{position:relative;width:100%;aspect-ratio:1/1.1;border-radius:22px;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.5)}
#scmsg{position:absolute;inset:0;background:radial-gradient(circle at 50% 0%,#2a1b5e,#0d0a24 70%);color:#f7e7b0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;gap:7px;border:2px solid #d4af37;border-radius:22px}
#scmsg .tr{font-size:.8rem;letter-spacing:.5px;font-weight:800;color:#1a1033;background:linear-gradient(90deg,#f6d365,#d4af37,#f6d365);border-radius:99px;padding:4px 14px}
#scmsg .e{font-size:2.1rem}#scmsg .h{font-size:1.3rem;font-weight:900;color:#ffd96b}#scmsg .t{font-size:.95rem;font-weight:500;line-height:1.55;color:#f1e9ff}
@keyframes scpop{from{transform:scale(.6) rotate(-8deg);opacity:0}to{transform:none;opacity:1}}
#scmsg .sp{font-size:.82rem;font-style:italic;line-height:1.5;color:#ffe9a8;opacity:.95;padding:0 4px}
#scmsg .nt{font-size:.82rem;font-weight:700;color:#1a1033;background:linear-gradient(90deg,#f6d365,#ffe9a8,#f6d365);border-radius:12px;padding:7px 10px;line-height:1.45}
#scmsg .s{font-size:.85rem;font-weight:700;color:#ffd96b;border:1px dashed #d4af37;border-radius:12px;padding:7px 10px;line-height:1.5}
#sccv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}

/* ===== Premium look (zone themed) ===== */
:root{--p:#7c3aed;--pd:#5b21b6;--pl:#8b5cf6;--pdd:#6d28d9;--rg:124,58,237;--pdk:#c4b5fd;--accent:var(--p);--bg:#f4f0ff;--ink:#2a2150;--muted:#7a7498;--line:#e2daf8}
body{font-family:'Noto Sans Gujarati','Segoe UI',system-ui,sans-serif;line-height:1.55;background:var(--bg) radial-gradient(900px 360px at 50% -80px,rgba(var(--rg),.14),transparent 70%) no-repeat;}
h1{color:var(--pd);letter-spacing:.2px;font-weight:800;} h2{color:var(--p);font-weight:800;}
.card{border-radius:18px;border:1px solid var(--line);box-shadow:0 6px 22px rgba(var(--rg),.09);}
.btn{background:linear-gradient(135deg,var(--pl),var(--pdd));border-radius:12px;padding:11px 18px;font-weight:800;box-shadow:0 4px 12px rgba(var(--rg),.3);transition:transform .12s,box-shadow .12s}
.btn:active{transform:translateY(1px) scale(.98);box-shadow:0 1px 4px rgba(var(--rg),.3)}
.btn.secondary{background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#3b2a00;box-shadow:0 4px 12px rgba(245,158,11,.35)}
.btn.ghost{background:transparent;box-shadow:none;border:2px solid var(--pl);color:var(--pdd)}
input,select{border:1.5px solid var(--line);border-radius:12px;padding:11px;font:inherit;background:var(--card)}
input:focus,select:focus{outline:none;border-color:var(--pl);box-shadow:0 0 0 3px rgba(139,92,246,.2)}
.cell{border-radius:11px;border:1.5px solid var(--line);background:var(--card);box-shadow:0 1px 3px rgba(var(--rg),.08);font-weight:700}
.cell.marked{background:linear-gradient(145deg,#7dd3fc,#0ea5e9);color:#00293b;border-color:#0284c7}
.cell.green{background:linear-gradient(145deg,#4ade80,#16a34a)}.cell.red{background:linear-gradient(145deg,#f87171,#dc2626)}
.zc{border-radius:10px;background:var(--card)}.zc.zk{background:linear-gradient(145deg,#7dd3fc,#0ea5e9)}
.zbtn{box-shadow:0 6px 16px rgba(var(--rg),.35);border-radius:14px;border:2px solid rgba(255,255,255,.35)}
.zlive,.zsum{border-radius:12px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) body{background:var(--bg)}h1,h2{color:var(--pdk)}.card{box-shadow:0 6px 22px rgba(0,0,0,.35)}}

/* ---- 3D avatar header ---- */
.phd{display:flex;align-items:center;gap:14px;margin:6px 0 10px}
.av3d{position:relative;flex:none;width:74px;height:74px;border-radius:50%;display:grid;place-items:center;font-size:2.4rem;
 background:radial-gradient(circle at 32% 26%,#fff 0,var(--pl) 22%,var(--p) 62%,var(--pd) 100%);
 box-shadow:0 12px 20px rgba(var(--rg),.42),inset -8px -10px 14px rgba(0,0,0,.28),inset 6px 6px 12px rgba(255,255,255,.4);
 animation:av3f 3.2s ease-in-out infinite}
.av3d::before{content:'';position:absolute;top:7px;left:12px;width:26px;height:14px;border-radius:50%;background:linear-gradient(180deg,rgba(255,255,255,.75),rgba(255,255,255,0));transform:rotate(-24deg)}
.av3d span{position:relative;filter:drop-shadow(0 4px 3px rgba(0,0,0,.35));transform:translateZ(0)}
@keyframes av3f{50%{transform:translateY(-4px)}}
.phm{min-width:0}.pnm{font-size:1.75rem;font-weight:800;line-height:1.15;color:var(--pd);word-break:break-word}
.pzn{display:inline-block;margin-top:4px;padding:3px 12px;border-radius:99px;font-weight:800;font-size:.9rem;color:#fff;background:linear-gradient(135deg,var(--pl),var(--pd));box-shadow:0 4px 10px rgba(var(--rg),.35)}
.prm{font-size:.7rem;color:var(--muted);margin-top:3px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .pnm{color:var(--pdk)}}
@media (prefers-reduced-motion:reduce){.av3d{animation:none}}

.sfxb{margin-left:auto;align-self:flex-start;border:0;background:var(--card);border-radius:50%;width:38px;height:38px;font-size:1.1rem;box-shadow:0 3px 10px rgba(var(--rg),.25);cursor:pointer}
.zbat{padding:10px 12px}.zbh{font-weight:800;font-size:.9rem;margin-bottom:6px}.zbh small{font-weight:600;color:var(--muted);margin-left:6px;font-size:.7rem}
.zbr{display:grid;grid-template-columns:minmax(0,34%) 1fr auto;gap:8px;align-items:center;padding:3px 0;font-size:.78rem}.zbr.me{font-weight:800;background:rgba(var(--rg),.1);border-radius:8px;padding:3px 5px}
.zbn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.zbtr{height:10px;border-radius:6px;background:rgba(var(--rg),.14);overflow:hidden}.zbtr i{display:block;height:100%;border-radius:6px;transition:width .6s}.zbv{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.72rem}

/* ---- cartoon avatars + connection banner ---- */
.avs{width:1em;height:1em;display:inline-block;vertical-align:-.15em}
.av3d .avs{width:82%;height:82%;vertical-align:0;filter:drop-shadow(0 4px 3px rgba(0,0,0,.3))}
#netb{position:fixed;left:0;right:0;top:0;z-index:300;text-align:center;font-weight:800;font-size:.85rem;padding:calc(7px + env(safe-area-inset-top,0px)) 10px 7px;color:#fff}
#netb.bad{background:#dc2626;animation:nb 1.2s ease-in-out infinite alternate}#netb.ok{background:#16a34a}@keyframes nb{to{background:#b91c1c}}

#prac{position:fixed;inset:0;z-index:150;background:rgba(10,8,25,.62);overflow:auto;padding:12px}#prac .pin{max-width:560px;margin:0 auto}
.pr-bar{height:9px;border-radius:6px;background:rgba(var(--rg),.15);overflow:hidden;margin:4px 0}.pr-bar i{display:block;height:100%;background:linear-gradient(90deg,#16a34a,#f59e0b,#dc2626);transition:width .3s linear}
.pr-q{font-weight:800;background:var(--bg);border-radius:10px;padding:8px 10px;margin:6px 0}.pr-t{background:#064e3b;color:#fff;border-radius:10px;padding:6px 10px;font-weight:700;font-size:.85rem;margin-top:6px}
.pr-r{border-radius:10px;padding:6px 10px;margin:5px 0;font-weight:600;font-size:.88rem}.pr-r.ok{background:#dcfce7;color:#14532d}.pr-r.no{background:#fee2e2;color:#7f1d1d}
.pr-cl{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}.pr-cl .btn{margin:0;padding:10px 4px;font-size:.8rem}.tip2{background:#fff7dc;color:#4a3a00;border-left:4px solid #f59e0b;border-radius:8px;padding:6px 9px;margin:8px 0;font-size:.82rem;font-weight:600}
.avpick{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin:6px 0 10px}.avp{aspect-ratio:1;border:2px solid var(--line);border-radius:12px;background:var(--card);padding:3px;cursor:pointer;font-size:1.7rem;display:grid;place-items:center}.avp.sel{border-color:var(--p);box-shadow:0 0 0 3px rgba(var(--rg),.3);background:rgba(var(--rg),.1)}
@media (max-width:420px){.avpick{grid-template-columns:repeat(4,1fr)}}
.mbn{border-radius:14px;padding:10px 12px;margin:8px 0;color:#fff;font-weight:700;box-shadow:0 3px 10px rgba(0,0,0,.18);position:relative;overflow:hidden}
.mbn b{display:block;font-size:1rem}.mbn span{display:block;font-size:.78rem;font-weight:600;opacity:.95;margin-top:2px}
.mbn.m1{background:linear-gradient(135deg,#0e7490,#2563eb)}.mbn.m2{background:linear-gradient(135deg,#b45309,#d97706)}.mbn.m3{background:linear-gradient(135deg,#6d28d9,#be185d)}
.mbn .mq{position:absolute;right:10px;top:8px;background:rgba(255,255,255,.22);border-radius:999px;padding:2px 9px;font-size:.74rem}
.mbrk{text-align:center;border:3px solid #d4a017;background:linear-gradient(180deg,#fff8dc,#ffeaa7);color:#5b3a00}
.mbrk .big{font-size:2.2rem}
.cell.cm1{box-shadow:inset 0 -4px 0 #2563eb}.cell.cm2{box-shadow:inset 0 -4px 0 #d97706}.cell.cm3{box-shadow:inset 0 -4px 0 #be185d}

#pmi.m2{--c1:#d97706;--c2:#fde68a}#pmi.m3{--c1:#be123c;--c2:#fda4af}

#pmi .i{width:150px;height:150px;opacity:0;animation:pmF .6s ease-out 1.3s both}

@keyframes pmF{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}@keyframes pmN{from{opacity:0;transform:scale(2.2);filter:blur(14px)}to{opacity:1;transform:none;filter:blur(0)}}@keyframes pmO{to{opacity:0;visibility:hidden}}

<body>
<div class="wrap" id="app">Loading…</div>
<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
const EMOJI_LIST=['🦁','🐯','🐼','🐵','🦊','🐸','🐧','🦉','🐢','🐝','🌸','⭐','🔥','🚀','👑','🎯'];
const IS_HOST=false;
const WINNER_ORDER=['line1','line2','line3','line4','line5','full','top3','top2','top1','zonefull','zone'];
// ===== Premium reveal music (Web Audio, generated live: no audio files) =====
const PM=(function(){
  let ctx=null,bus=null,master=null,padT=null,spT=null,fadeT=null,on=true,lastStep=-1,running=false,stoppedFor=-2,ci=0;
  try{ on=localStorage.getItem('pmOn')!=='0'; }catch(e){}
  const hz=m=>440*Math.pow(2,(m-69)/12);
  function ensure(){
    if(ctx) return ctx;
    try{
      const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return null; ctx=new AC();
      const comp=ctx.createDynamicsCompressor(); master=ctx.createGain(); master.gain.value=on?0.9:0;
      bus=ctx.createGain();
      const len=Math.floor(ctx.sampleRate*2.4), buf=ctx.createBuffer(2,len,ctx.sampleRate);
      for(let c=0;c<2;c++){ const d=buf.getChannelData(c); for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.6); }
      const verb=ctx.createConvolver(); verb.buffer=buf; const vg=ctx.createGain(); vg.gain.value=.4;
      bus.connect(comp); bus.connect(verb); verb.connect(vg); vg.connect(comp); comp.connect(master); master.connect(ctx.destination);
    }catch(e){ ctx=null; }
    return ctx;
  }
  function note(m,t,dur,type,vol,o){ o=o||{};
    const x=ctx.createOscillator(),g=ctx.createGain(),f=ctx.createBiquadFilter();
    x.type=type; x.frequency.value=hz(m); if(o.det) x.detune.value=o.det;
    f.type='lowpass'; f.frequency.value=o.lp||2400;
    g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(vol,t+(o.a||0.02)); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    x.connect(f); f.connect(g); g.connect(bus); x.start(t); x.stop(t+dur+0.05);
  }
  function thump(t){ const x=ctx.createOscillator(),g=ctx.createGain(); x.type='sine'; x.frequency.setValueAtTime(150,t); x.frequency.exponentialRampToValueAtTime(42,t+0.4);
    g.gain.setValueAtTime(0.55,t); g.gain.exponentialRampToValueAtTime(0.0001,t+0.55); x.connect(g); g.connect(bus); x.start(t); x.stop(t+0.6); }
  function chord(ms,t,dur,vol){ ms.forEach((m,i)=>{ note(m,t+i*0.07,dur,'sawtooth',vol,{det:-7,lp:2600,a:0.03}); note(m,t+i*0.07,dur,'sawtooth',vol,{det:7,lp:2600,a:0.03}); }); note(ms[0]-12,t,dur,'triangle',vol*2.2,{lp:500,a:0.02}); }
  const PENTA=[0,2,4,7,9];
  function spark(){ if(!ctx||!running||Math.random()<.35) return; const m=84+PENTA[Math.floor(Math.random()*5)]+(Math.random()<.4?12:0); note(m,ctx.currentTime+0.02,1.6,'sine',0.018,{lp:6000,a:0.01}); }
  const PAD=[[48,55,64,67],[45,52,60,64],[41,48,57,60],[43,50,59,62]];
  function pad(){ if(!ctx||!running) return; const t=ctx.currentTime+0.05, c=PAD[ci++%4]; c.forEach(m=>note(m,t,5.6,'triangle',0.04,{lp:900,a:1.4})); }
  function sting(kind){
    if(!ensure()) return; const t=ctx.currentTime+0.05;
    if(kind==='win'){ thump(t); chord([60,64,67,72],t,2.4,0.05); for(let i=0;i<5;i++) note(88+PENTA[i%5],t+0.35+i*0.09,1.4,'sine',0.03,{lp:7000,a:0.01}); }
    else { thump(t); chord([60,64,67,72],t,1.0,0.05); chord([65,69,72,77],t+0.5,1.0,0.05); chord([67,71,74,79],t+1.0,1.0,0.055); thump(t+1.5); chord([72,76,79,84],t+1.5,4.2,0.06);
      for(let i=0;i<14;i++) note(84+PENTA[i%5]+(i>8?12:0),t+1.6+i*0.11,1.8,'sine',0.03,{lp:7000,a:0.01}); }
  }
  function btn(show){
    let b=document.getElementById('pmbtn');
    if(!show){ if(b) b.style.display='none'; return; }
    if(!b){ b=document.createElement('button'); b.id='pmbtn'; b.type='button'; b.title='Music On/Off';
      b.style.cssText='position:fixed;right:14px;bottom:14px;z-index:9998;width:46px;height:46px;border-radius:50%;border:2px solid #d4af37;background:#1a1240;color:#ffd96b;font-size:1.3rem;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.4)';
      b.onclick=function(){ on=!on; try{localStorage.setItem('pmOn',on?'1':'0');}catch(e){} if(ensure()){ if(ctx.state==='suspended') ctx.resume(); master.gain.setTargetAtTime(on?0.9:0,ctx.currentTime,0.05); } btn(true); };
      document.body.appendChild(b); }
    b.style.display='block'; b.textContent=on?'🎵':'🔇';
  }
  function start(){ if(running) return; running=true; pad(); padT=setInterval(pad,4600); spT=setInterval(spark,650); }
  function stop(){ running=false; clearInterval(padT); clearInterval(spT); if(fadeT){clearTimeout(fadeT);fadeT=null;} }
  function unlock(){ if(ensure() && ctx.state==='suspended') ctx.resume(); }
  ['pointerdown','touchstart','keydown','click'].forEach(ev=>document.addEventListener(ev,unlock,{passive:true}));
  function sync(r,len){
    const live=!!r && r.status==='revealed', step=live?(r.revealStep||0):-1;
    if(!live){ if(running) stop(); lastStep=-1; stoppedFor=-2; btn(false); return; }
    btn(true); if(!ensure()) return; if(ctx.state==='suspended') ctx.resume();
    if(step!==lastStep){ lastStep=step; if(step>=1) sting(step>len?'grand':'win'); if(fadeT){clearTimeout(fadeT);fadeT=null;} stoppedFor=-2; }
    if(!running && stoppedFor!==step && step>=1) start();
    if(step>len && !fadeT && running) fadeT=setTimeout(function(){ stop(); stoppedFor=step; },30000);
  }
  return {sync:sync};
})();
function musicSync(r){ try{ PM.sync(r,WINNER_ORDER.length); }catch(e){} }
const WINNER_LABELS={line1:'1 Line',line2:'2 Line',line3:'3 Line',line4:'4 Line',line5:'5 Line',full:'Full House',top3:'🥉 3rd Score',top2:'🥈 2nd Score',top1:'🥇 Overall Champion',zonefull:'🏆 Zone Full House',zone:'🏅 Zone Champion'};
const prefillCode=(new URLSearchParams(location.search).get('code')||'').toUpperCase();
let state={
  screen:'join',
  profile: JSON.parse(localStorage.getItem('quizProfile')||'{"name":"","avatar":"🦁","zone":""}'),
  joinErr:'',
  code:null, name:null, room:null, joinErr:''
};
let audioOn=true, uploadedPhoto=null;
const _mem={};
function ssGet(k){ try{ const v=sessionStorage.getItem(k); return v==null?(_mem[k]||null):v; }catch(e){ return _mem[k]||null; } }
function ssSet(k,v){ _mem[k]=v; try{ sessionStorage.setItem(k,v); }catch(e){} }
// identity is per browser TAB (never shared between tabs / people on one phone); the secret token proves "this is my card"
function getClientId(){ let id=ssGet('quizClientId'); if(!id){ id='c'+Date.now()+Math.random().toString(36).slice(2); ssSet('quizClientId',id); } return id; }
function idp(){ return {clientId:getClientId(), key:state.name, token:state.token}; }
function saveSess(s){ const v=JSON.stringify(s); ssSet('quizSess',v); try{ localStorage.setItem('quizSessL',v); }catch(e){} }
function sess(){ try{ return JSON.parse(ssGet('quizSess')||'null'); }catch(e){ return null; } }
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
let currentUtterance=null;
function toggleAudio(){ audioOn=!audioOn; if(!audioOn && 'speechSynthesis' in window) window.speechSynthesis.cancel(); render(); }
function speakQuestion(text, force){
  if(!('speechSynthesis' in window)){ if(force) alert('આ browser Speech સપોર્ટ નથી કરતું.'); return; }
  if(!audioOn && !force) return;
  const synth=window.speechSynthesis;
  const doSpeak=()=>{
    const voices=synth.getVoices();
    const gv=voices.find(v=>v.lang&&v.lang.toLowerCase().startsWith('gu'));
    if(force && voices.length===0){ alert('આ device પર કોઈ TTS voice મળી નથી.'); return; }
    const u=new SpeechSynthesisUtterance(text);
    u.lang='gu-IN'; u.rate=0.95; if(gv) u.voice=gv;
    if(force) u.onerror=(e)=>alert('Speech Error: '+(e.error||'unknown'));
    currentUtterance=u;
    synth.speak(u);
  };
  try{
    if(synth.speaking||synth.pending) synth.cancel();
    setTimeout(()=>{ if(synth.getVoices().length) doSpeak(); else synth.onvoiceschanged=doSpeak; }, 150);
  }catch(e){ if(force) alert('Audio error: '+e.message); }
}
setInterval(()=>{ if('speechSynthesis' in window && window.speechSynthesis.paused) window.speechSynthesis.resume(); },4000);
let lastSpokenIdx=null;
function maybeSpeak(r){ if(r.status==='question' && r.curIdx!=null && r.curIdx!==lastSpokenIdx){ lastSpokenIdx=r.curIdx; speakQuestion(r.questions[r.curIdx].q); } else if(r.status==='active'||r.status==='lobby') lastSpokenIdx=null; }

function uiJoinRoom(){
  const name=document.getElementById('joinName').value.trim();
  const zone=document.getElementById('joinZone').value.trim();
  const avatar=document.getElementById('joinAvatar').value;
  const keepForm=()=>{ render(); document.getElementById('joinName').value=name; document.getElementById('joinZone').value=zone; document.getElementById('joinAvatar').value=avatar; document.getElementById('joinCode').value=code; };
  const code=document.getElementById('joinCode').value.trim().toUpperCase();
  if(!name){ state.joinErr='તમારું નામ નાખો.'; keepForm(); return; }
  if(!zone){ state.joinErr='Zone નું નામ નાખો.'; keepForm(); return; }
  state.profile={name,avatar,zone};
  socket.emit('player:join',{code,name,zone,avatar,clientId:getClientId(),token:(function(){const q=sess(); return q&&q.code===code&&String(q.name||'').trim().toLowerCase()===name.toLowerCase()&&String(q.zone||'').trim().toLowerCase()===zone.toLowerCase()?q.token:undefined;})()},(res)=>{
    if(!res.ok){ state.joinErr=res.error; keepForm(); if(res.retry && (uiJoinRoom._n=(uiJoinRoom._n||0)+1)<=8) setTimeout(()=>{ if(!state.code && document.getElementById('joinName')) uiJoinRoom(); },5000); return; }
    uiJoinRoom._n=0;
    state.code=code; state.name=res.yourKey; state.token=res.token; state.joinErr=''; saveSess({code,name,zone,avatar,key:res.yourKey,token:res.token}); if(res.priv){ state.fifty=res.priv.fifty||null; state.copy=res.priv.copy||null; }
    state.room=res.room; socket.emit('subscribe',Object.assign({code},idp())); render();
    if(!res.resumed && res.yourKey!==name.trim()) alert('બીજા Zone માં આ નામ પહેલેથી છે — તમે "'+res.yourKey+'" તરીકે Join થયા. Winner list માં આ જ નામ શોધજો.');
  });
}
socket.on('state', r=>{ if(state.code && r.code===state.code){ if(state.name&&state.room&&state.room.players&&state.room.players[state.name]&&r.players&&!r.players[state.name]&&r.status!=='revealed') r.players[state.name]=state.room.players[state.name]; state.room=r; qaAuto(r); maybeSpeak(r); render(); musicSync(r); scAutoCheck(r); } });
function scAutoCheck(r){ try{ if(r.status==='revealed' && r.scReveal && (r.revealStep||0)>WINNER_ORDER.length){ const k='scAuto_'+r.code+'_'+(r.createdAt||''); if(localStorage.getItem(k)) return; localStorage.setItem(k,'1'); setTimeout(()=>{ try{scOpen();}catch(e){} },700); } }catch(e){} }
socket.on('me', m=>{ if(state.code&&state.room&&m&&m.name===state.name&&state.room.status!=='revealed'){ state.room.players[m.name]=m.p; render(); } });
socket.on('connect', ()=>{ if(state.code) socket.emit('subscribe',Object.assign({code:state.code},idp()),(res)=>{ if(res&&res.ok&&res.room){ state.room=res.room; render(); } }); });
// if the server slept/restarted and the host restored the game, re-join the room automatically
setInterval(()=>{ if(state.code) socket.emit('resync',Object.assign({code:state.code},idp()),(res)=>{ if(res&&res.ok&&res.room){ state.room=res.room; render(); } }); },4000);

let _rj=0;
function applyRes(s,res){ state.code=s.code; state.name=res.yourKey; state.token=res.token; state.profile={name:s.name,avatar:s.avatar,zone:s.zone}; state.joinErr='';
  if(res.priv){ state.fifty=res.priv.fifty||null; state.copy=res.priv.copy||null; }
  { const pp=res.room&&res.room.players&&res.room.players[res.yourKey]; if(pp&&pp.baseName) s=Object.assign({},s,{name:pp.baseName}); state.profile.name=s.name; } saveSess({code:s.code,name:s.name,zone:s.zone,avatar:s.avatar,key:res.yourKey,token:res.token}); state.room=res.room; socket.emit('subscribe',Object.assign({code:s.code},idp())); render(); }
function autoRejoin(){   // our card is missing from the server state (reconnect / server restart / restore): get it back with the secret token
  const now=Date.now(); if(now-_rj<2500||!state.code) return; _rj=now; const s=sess(); if(!s||s.code!==state.code) return;
  socket.emit('player:join',{code:s.code,name:s.name,zone:s.zone,avatar:s.avatar,clientId:getClientId(),token:state.token||s.token},res=>{ if(res&&res.ok) applyRes(s,res); });
}
setInterval(()=>{ if(state.code&&state.room&&state.room.players&&!state.room.players[state.name]) autoRejoin(); },3000);
let _auto=false;   // refresh of THIS tab: go straight back into the game with this tab's own card
socket.on('connect',()=>{ if(_auto||state.code) return; _auto=true; const s=sess(); if(!s||(prefillCode&&prefillCode!==s.code)) return;
  socket.emit('player:join',{code:s.code,name:s.name,zone:s.zone,avatar:s.avatar,clientId:getClientId(),token:s.token},res=>{
    if(res&&res.ok) applyRes(s,res); else { try{ sessionStorage.removeItem('quizSess'); }catch(e){} _mem.quizSess=null; } }); });
function contBtn(){ try{ if(state.code) return ''; const s=JSON.parse(localStorage.getItem('quizSessL')||'null'); if(!s||(prefillCode&&s.code!==prefillCode)) return '';
  return '<button class="btn ghost" onclick="uiContinue()">↩ '+esc(s.name)+' ('+esc(s.zone)+') તરીકે પાછા આવો</button>'; }catch(e){ return ''; } }
function uiContinue(){ let s=null; try{ s=JSON.parse(localStorage.getItem('quizSessL')||'null'); }catch(e){} if(!s) return;
  socket.emit('player:join',{code:s.code,name:s.name,zone:s.zone,avatar:s.avatar,clientId:getClientId(),token:s.token},res=>{ if(res&&res.ok) applyRes(s,res); else { state.joinErr=(res&&res.error)||'જોડાઈ શકાયું નહિ'; render(); } }); }

function playerMark(ci){ socket.emit('player:mark',{code:state.code,name:state.name,ci}); }
socket.on('zlive', d=>{ state.zl=d; if(state.room&&state.room.status==='question') render(); });

/* ===== 🕉 Sankalp + 🏛 Zone Pratigya + 🎡 Karm Chakra ===== */
const KARMA_PL=[['🌱','આશીર્વાદ','સૌથી ઓછા સાચા જવાબ વાળા Zone ને +4'],['⚖️','ન્યાય','દરેક Player નો એક ખોટા જવાબનો −1 માફ (Mode-1 માં +1 ભેટ)'],['🏃','ઝડપ','Mode ના સૌથી ઝડપી સાચા જવાબ આપનાર ને +3'],['🌪','તોફાન','સૌથી વધુ ખોટા જવાબ વાળા Zone ને −2'],['🪔','પ્રકાશ','કોઈ પણ 5 Players ને રેન્ડમ +3'],['🔥','અગ્નિ પરીક્ષા','સૌથી વધુ સાચા જવાબ વાળા Zone ને −2']];
const SANK_PL=[[4,5,-2],[6,10,-5],[8,15,-7]], SANK_COL=[['#06b6d4','#2563eb'],['#8b5cf6','#d946ef'],['#f59e0b','#ef4444']];
setInterval(()=>{ try{ const r=state.room; if(r&&r.mstage==='sankalp'&&r.sankEnd&&Date.now()<r.sankEnd+1200) render(); }catch(e){} },1000);
function sankPick(n){ const r=state.room; if(!r||r.mySank||state.sankSelM===r.sankFor&&state.sankSel) return; state.sankSel=n; state.sankSelM=r.sankFor; socket.emit('player:sankalp',{code:state.code,name:state.name,pick:n}); render(); }
const KSEEN={k:null,t:0};
function mstageHTML(r){
  if(r.mstage==='sankalp'){ const m=r.sankFor||1, left=Math.max(0,Math.ceil(((r.sankEnd||0)-Date.now())/1000)), my=(state.sankSelM===m&&state.sankSel)?state.sankSel:(r.mySank||0), closed=left<=0, pct=Math.round(left*100/60);
    const btns=SANK_PL.map((o,i)=>{ const on=my===o[0], dis=!!my||closed, c=SANK_COL[i]; return `<button ${dis?'disabled':''} onclick="sankPick(${o[0]})" style="flex:1;border:0;border-radius:18px;padding:14px 4px;color:#fff;font:inherit;background:linear-gradient(145deg,${c[0]},${c[1]});box-shadow:${on?'0 0 0 4px #fff,0 0 0 7px '+c[1]+',0 10px 24px '+c[1]+'88':'0 8px 18px '+c[1]+'66'};opacity:${dis&&!on?.35:1};transform:${on?'scale(1.06)':'none'};transition:.2s"><span style="display:block;font-size:2.1rem;font-weight:900;line-height:1">${o[0]}</span><small style="display:block;font-weight:700;opacity:.95">સાચા જવાબ</small><b style="display:block;margin-top:4px;background:rgba(255,255,255,.25);border-radius:99px;padding:2px 0">+${o[1]}</b><small style="display:block;margin-top:3px;font-weight:800">ન પાળો: ${o[2]}</small></button>`; }).join('');
    return `<div class="card" style="text-align:center;background:linear-gradient(160deg,#1e1b4b,#4c1d95 55%,#9d174d);color:#fff;border:0;box-shadow:0 14px 34px rgba(76,29,149,.45)"><div style="font-size:.78rem;letter-spacing:.18em;font-weight:800;color:#fde68a">MODE-${m} · સંકલ્પ + ઝોન પ્રતિજ્ઞા</div><div style="font-size:1.25rem;font-weight:900;margin:6px 0 2px">આ Mode માં હું કેટલા સાચા જવાબ આપીશ?</div><div style="font-size:.82rem;opacity:.85">એક જ વાર પસંદ કરી શકાશે, પછી બદલાશે નહિ</div>
    <div style="height:8px;border-radius:99px;background:rgba(255,255,255,.2);margin:12px 0 4px;overflow:hidden"><i style="display:block;height:100%;width:${pct}%;background:linear-gradient(90deg,#34d399,#fde047,#f87171);transition:width 1s linear"></i></div><div style="font-weight:900;color:${left<=10?'#fca5a5':'#fde68a'}">⏱ ${closed?'સમય પૂરો':left+' સેકન્ડ'}</div>
    <div style="display:flex;gap:10px;margin:14px 0">${btns}</div>
    <div style="font-weight:800;color:${my?'#86efac':'#fde68a'}">${my?`🔒 તમારો સંકલ્પ: ${my} સાચા જવાબ`:(closed?'⌛ તમે સંકલ્પ લીધો નથી (−2 સજા)':'👆 એક પસંદ કરો')}</div>
    <div style="margin-top:10px;font-size:.82rem;opacity:.9;background:rgba(255,255,255,.12);border-radius:12px;padding:8px">🏛 તમારા Zone ના 70% કે વધુ Players સંકલ્પ પાળે તો આખા Zone ને +10, ઓછા પાળે તો Zone ના દરેકને −10<br>⚠️ સંકલ્પ ન લો તો સૌથી નાના સંકલ્પ (4) ની સજા −2<br>પરિણામ છેલ્લે Result માં ખૂલશે</div></div>`; }
  const m=r.chakraFor, ki=(r.karmaKeys||{})[m], has=ki!=null&&ki>=0;
  if(!has) return `<div class="card" style="text-align:center"><div style="font-size:2.4rem">🎡</div><b>Mode-${m} પૂરો!</b><div class="muted">Host કર્મ ચક્ર ફેરવશે… Projector સામે જુઓ.</div></div>`;
  const key=m+':'+r.karmaSpin; if(KSEEN.k!==key){KSEEN.k=key;KSEEN.t=Date.now();setTimeout(()=>{ try{render()}catch(e){} },5100);}
  if(Date.now()-KSEEN.t<5000) return `<div class="card" style="text-align:center"><div style="font-size:2.4rem">🎡</div><b>ચક્ર ફરે છે…</b><div class="muted">Projector સામે જુઓ</div></div>`;
  const K=KARMA_PL[ki];
  return `<div class="card" style="text-align:center"><div style="font-size:3rem">${K[0]}</div><b style="font-size:1.2rem">કર્મ: ${K[1]}</b><div class="muted" style="margin:6px 0">${K[2]}</div><div class="muted">🔒 તમને કેટલું મળ્યું તે છેલ્લે Result માં ખૂલશે.</div></div>`;
}
function epiRows(res){   // [[label,value]] for the report card
  const rows=[]; const sg=n=>(n>0?'+':'')+n;
  (res.pukarRows||[]).forEach(x=>rows.push(['📣 Zone Pukar મદદ: '+x.asker+' (Q'+(x.qi+1)+')'+(x.right?' ✅':''),sg(x.pts)]));
  (res.sank||[]).forEach(x=>rows.push(['🎯 Mode-'+x.m+(x.auto?' સંકલ્પ લીધો નહિ ❌':' સંકલ્પ '+x.pick+' → સાચા '+x.got+(x.met?' ✅':' ❌')),sg(x.pts)]));
  (res.karmaP||[]).forEach(x=>{ const K=KARMA_PL[['ashirvad','nyay','zadap','toofan','prakash','agni'].indexOf(x.key)]; if(x.pts) rows.push(['🎡 Mode-'+x.m+' કર્મ: '+K[0]+' '+K[1],sg(x.pts)]); });
  return rows;
}
function epiZoneRows(res){
  const rows=[]; const sg=n=>(n>0?'+':'')+n;
  (res.prat||[]).forEach(x=>rows.push(['🏛 Mode-'+x.m+' Zone પ્રતિજ્ઞા '+x.met+'/'+x.count+' ('+x.pct+'%)'+(x.ok?' ✅':' ❌'),sg(x.pts)]));
  (res.karmaZ||[]).forEach(x=>{ const K=KARMA_PL[['ashirvad','nyay','zadap','toofan','prakash','agni'].indexOf(x.key)]; rows.push(['🎡 Mode-'+x.m+' કર્મ: '+K[0]+' '+K[1]+' (Zone)',sg(x.pts)]); });
  return rows;
}

function zoneBattleHTML(r,p){

const PRAC_NOTE='<div class="tip2">🛟 ખરી Game માં 3 Mode (🛡 સુદર્શન શીલ્ડ · ✨ માવતર કૃપા · 🪙 દિવ્ય આશીર્વાદ દાવ), દરેક Mode ની Life Lines, 🎴 Zone Card અને 💎⭐💣 છુપાયેલાં ખાનાં હશે — બધું Reveal સુધી છુપું.</div>';

  const sh=a=>{ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]} return a; };
  const LINES=[]; for(let r=0;r<5;r++){ LINES.push([0,1,2,3,4].map(c=>r*5+c)); } for(let c=0;c<5;c++){ LINES.push([0,1,2,3,4].map(r=>r*5+c)); } LINES.push([0,6,12,18,24],[4,8,12,16,20]);
  const line=LINES[Math.floor(Math.random()*LINES.length)], slots=sh(line), cells=Array(25).fill(null);

  PR={q:Q,cells,lines:LINES,i:0,pick:[],t0:Date.now(),tStart:Date.now(),done:false,claim:false,tm:null,tc:0,ms:0,total:0}; pracTimer(); pracRender(); }
