<style>
:root{--bg:#f4f0ff;--card:#fff;--ink:#2a2150;--muted:#7a7498;--accent:#7c3aed;--accent2:#f59e0b;--line:#e2daf8;}

*{box-sizing:border-box;} body{margin:0;background:var(--bg);color:var(--ink);font-family:'Segoe UI',system-ui,sans-serif;}
.wrap{max-width:640px;margin:0 auto;padding:20px 16px 40px;}
h1{font-size:1.3rem;} h2{font-size:1.05rem;color:var(--accent);}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0;}
.btn{display:inline-block;background:var(--accent);color:#fff;border:none;border-radius:10px;padding:10px 16px;font-weight:600;cursor:pointer;margin:4px 6px 4px 0;}
.btn.secondary{background:var(--accent2);} .btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent);}
input,textarea{width:100%;padding:9px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);margin:4px 0 10px;}
.code{font-size:1.6rem;font-weight:800;letter-spacing:3px;color:var(--accent);}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.timer{font-size:2rem;font-weight:800;color:#dc2626;}
.qtext{font-size:1.05rem;font-weight:600;background:var(--bg);padding:10px;border-radius:10px;}
.muted{color:var(--muted);font-size:.85rem;}
ul{padding-left:18px;} .pill{display:inline-block;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:.75rem;margin:2px;}
.overflow{overflow-x:auto;}
.stbl{width:100%;font-size:.8rem;border-collapse:collapse;border:1px solid var(--line);}
.stbl th,.stbl td{border:1px solid var(--line);padding:7px 8px;}
.stbl th{background:var(--accent);color:#fff;font-weight:700;}
.stbl tr:nth-child(even) td{background:rgba(124,58,237,.06);}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
.big-winner{position:relative;overflow:hidden;text-align:center;background:linear-gradient(160deg,var(--accent),var(--accent2));color:#fff;padding:34px 12px;animation:pop .6s ease-out;border-radius:18px;
  box-shadow:0 0 0 3px rgba(255,215,0,.55), 0 0 40px 8px rgba(255,215,0,.35); animation:pop .6s ease-out, glowPulse 1.8s ease-in-out infinite;}
.big-winner::before{content:'';position:absolute;top:0;left:-60%;width:40%;height:100%;
  background:linear-gradient(120deg,transparent,rgba(255,255,255,.4),transparent);transform:skewX(-20deg);animation:sweep 2.6s ease-in-out infinite;pointer-events:none;}
.big-winner .crown{font-size:3.2rem;animation:crownPulse 1.3s ease-in-out infinite;display:inline-block;}
.big-winner .win-cat{font-size:2.3rem;font-weight:900;letter-spacing:1.5px;text-transform:uppercase;margin-top:4px;
  background:linear-gradient(90deg,#fff6c8,#ffd700,#fff6c8);background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow:0 0 22px rgba(255,215,0,.55); animation:shimmer 2s linear infinite;}
.big-winner .win-avatar{font-size:4.2rem;margin-top:10px;animation:pop .8s ease-out;}
.big-winner .win-name{font-size:2.1rem;font-weight:800;margin-top:4px;} .big-winner .win-zone{font-size:1.1rem;opacity:.92;}
.spark{position:absolute;font-size:1.3rem;animation:twinkle 1.6s ease-in-out infinite;pointer-events:none;}
@keyframes shimmer{to{background-position:-200% center;}}
@keyframes crownPulse{0%,100%{transform:scale(1) rotate(-5deg);}50%{transform:scale(1.18) rotate(5deg);}}
@keyframes sweep{0%{left:-60%;}100%{left:130%;}}
@keyframes glowPulse{0%,100%{box-shadow:0 0 0 3px rgba(255,215,0,.55),0 0 40px 8px rgba(255,215,0,.32);}50%{box-shadow:0 0 0 3px rgba(255,215,0,.85),0 0 60px 14px rgba(255,215,0,.55);}}
@keyframes twinkle{0%,100%{opacity:.2;transform:scale(.7) rotate(0deg);}50%{opacity:1;transform:scale(1.25) rotate(20deg);}}
.winmini{position:relative;overflow:hidden;border-radius:14px;padding:14px 6px;text-align:center;
  animation:pop .5s ease-out, glowPulse 1.8s ease-in-out infinite;
  box-shadow:0 0 0 2px rgba(255,215,0,.6), 0 0 16px 3px rgba(255,215,0,.35);}
.winmini::before{content:'';position:absolute;top:0;left:-60%;width:40%;height:100%;
  background:linear-gradient(120deg,transparent,rgba(255,255,255,.35),transparent);transform:skewX(-20deg);animation:sweep 2.6s ease-in-out infinite;pointer-events:none;}
.winmini .mcrown{font-size:1.3rem;animation:crownPulse 1.3s ease-in-out infinite;display:inline-block;}
.winmini .mlbl{font-size:.72rem;font-weight:900;letter-spacing:.5px;text-transform:uppercase;
  background:linear-gradient(90deg,#fff6c8,#ffd700,#fff6c8);background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;
  animation:shimmer 2.4s linear infinite;}
.winmini .mav{font-size:2rem;margin:4px 0 2px;animation:pop .8s ease-out;} .winmini .mnm{font-size:1.1rem;font-weight:800;color:#fff;} .winmini .mzn{font-size:.7rem;color:rgba(255,255,255,.85);}
.winmini .mspark{position:absolute;font-size:.9rem;animation:twinkle 1.6s ease-in-out infinite;pointer-events:none;}
.numpop{text-align:center;background:linear-gradient(160deg,#7c3aed,#f59e0b);color:#fff;border-radius:22px;padding:30px 20px;
  box-shadow:0 0 0 3px rgba(255,215,0,.6), 0 0 50px 10px rgba(255,215,0,.4); animation:popBig .45s cubic-bezier(.17,.89,.32,1.49);}
.numpop .lbl{font-size:1.1rem;font-weight:700;letter-spacing:1px;opacity:.9;text-transform:uppercase;}
.numpop .num{font-size:5rem;font-weight:900;line-height:1.1;text-shadow:0 0 24px rgba(255,255,255,.6);}

.drum{width:230px;height:230px;border-radius:50%;border:5px solid var(--ink);background:rgba(124,58,237,.08);position:relative;overflow:hidden}
.ball{position:absolute;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:14px;border:2px solid #fff}
.shake .ball{animation:shk .25s infinite alternate}@keyframes shk{0%{transform:translate(0,0)}100%{transform:translate(var(--dx),var(--dy))}}
.bout{width:78px;height:78px;border-radius:50%;background:var(--accent);color:#fff;font-size:30px;font-weight:800;display:flex;align-items:center;justify-content:center;border:4px solid #fff;box-shadow:0 4px 14px rgba(0,0,0,.3);transform:scale(0);transition:transform .4s}.bout.show{transform:scale(1)}
.dice{display:flex;gap:18px}.die{width:84px;height:84px;border-radius:14px;background:#fff;border:3px solid #2a2118;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:8px;gap:2px}.die i{border-radius:50%}.die i.p{background:#2a2118}
.roll{animation:rl .5s infinite}@keyframes rl{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}
.slots{display:flex;gap:12px}.reel{width:92px;height:110px;border:4px solid var(--ink);border-radius:12px;background:var(--card);display:flex;align-items:center;justify-content:center;font-size:60px;font-weight:800}

/* ===== Premium look (host themed) ===== */
:root{--p:#7c3aed;--pd:#5b21b6;--pl:#8b5cf6;--pdd:#6d28d9;--rg:124,58,237;--pdk:#c4b5fd;--accent:var(--p);--bg:#f4f0ff;--ink:#2a2150;--muted:#7a7498;--line:#e2daf8}
body{font-family:'Noto Sans Gujarati','Segoe UI',system-ui,sans-serif;line-height:1.55;background:var(--bg) radial-gradient(900px 360px at 50% -80px,rgba(var(--rg),.14),transparent 70%) no-repeat;}
h1{color:var(--pd);letter-spacing:.2px;font-weight:800;} h2{color:var(--p);font-weight:800;}
.card{border-radius:18px;border:1px solid var(--line);box-shadow:0 6px 22px rgba(var(--rg),.09);}

.zc{border-radius:10px;background:var(--card)}.zc.zk{background:linear-gradient(145deg,#7dd3fc,#0ea5e9)}

#hthm{position:fixed;right:max(12px,env(safe-area-inset-right,0px));bottom:max(12px,env(safe-area-inset-bottom,0px));z-index:70;font:inherit}#hthm>button{width:46px;height:46px;border-radius:50%;border:2px solid #fff;background:linear-gradient(135deg,var(--pl),var(--pd));color:#fff;font-size:1.3rem;box-shadow:0 6px 18px rgba(var(--rg),.45);cursor:pointer}#hthm .pal{display:none;position:absolute;right:0;bottom:56px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px;box-shadow:0 10px 30px rgba(0,0,0,.2);width:200px;grid-template-columns:repeat(4,1fr);gap:8px}#hthm.open .pal{display:grid}#hthm .pal i{display:block;aspect-ratio:1;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px var(--line);cursor:pointer}#hthm .pal b{grid-column:1/-1;font-size:.72rem;color:var(--muted)}

#pj .pjx{position:fixed;top:max(10px,env(safe-area-inset-top,0px));right:max(10px,env(safe-area-inset-right,0px));border:0;border-radius:50%;width:42px;height:42px;background:rgba(255,255,255,.18);color:#fff;font-size:1.2rem;cursor:pointer}

.pjs{font-size:clamp(1rem,2.6vw,2rem);opacity:.92;font-weight:700}.pjn{font-size:clamp(2rem,6vw,4rem);font-weight:900;margin-top:10px}

.pjc{font-size:clamp(3rem,9vw,6rem)}.pjl{font-size:clamp(1.6rem,6vw,4rem);font-weight:900;color:#fde68a;text-transform:uppercase;letter-spacing:2px}.pjav{font-size:clamp(5rem,18vw,12rem);line-height:1.1;filter:drop-shadow(0 12px 14px rgba(0,0,0,.4))}

.pjg{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;width:100%}.pjt2{background:rgba(255,255,255,.14);border-radius:16px;padding:10px 6px}.pjt2 small{display:block;font-weight:800;color:#fde68a}.pjt2 b{display:block;font-size:2.4rem}.pjt2 span{font-weight:800}

#pj .pjbig{font-size:clamp(2.4rem,min(9vw,14vh),7rem)}
#pj .pjqr{width:min(36vw,38vh,360px);height:min(36vw,38vh,360px)}
#pj .pjq{font-size:clamp(1.3rem,min(4vw,6vh),3.2rem);font-family:'Noto Serif Gujarati','Noto Sans Gujarati',serif;font-weight:800}
#pj .pjt{font-size:clamp(3rem,min(15vw,19vh),9rem)}
#pj .pjimg{max-height:40vh}
#pj .pjin{padding-bottom:110px}
.pjchip{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);border-radius:99px;padding:4px 18px;font-weight:800;font-size:clamp(.9rem,2.4vh,1.5rem);color:#fde68a}
#pj .pjname{font-family:'Playfair Display','Noto Serif Gujarati',serif;font-weight:900;letter-spacing:.5px;background:linear-gradient(180deg,#fff7d6 0%,#fde68a 45%,#f59e0b 100%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;filter:drop-shadow(0 4px 10px rgba(0,0,0,.45))}
#pj .pjl{font-family:'Cinzel','Noto Serif Gujarati',serif;font-weight:700;letter-spacing:.18em;color:#fde68a;text-shadow:0 0 18px rgba(253,224,71,.55)}
#pj .pjzn{font-family:'Cinzel','Noto Sans Gujarati',serif;letter-spacing:.12em;font-weight:700;border:1px solid rgba(253,230,138,.6)}
#pj .pjclaim{font-family:'Playfair Display','Noto Serif Gujarati',serif;font-weight:700}

#htool{position:fixed;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(max(12px,env(safe-area-inset-bottom,0px)) + 168px);z-index:70;width:46px;height:46px;border-radius:50%;border:2px solid #fff;background:linear-gradient(135deg,#64748b,var(--pd));color:#fff;font-size:1.2rem;box-shadow:0 6px 18px rgba(0,0,0,.35);cursor:pointer}
#htl{position:fixed;inset:0;z-index:170;background:rgba(10,8,25,.62);overflow:auto;padding:12px;display:none}#htl .hin{max-width:680px;margin:0 auto}
#htl .tsec{border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin:10px 0}#htl .tsec h3{margin:0 0 6px;font-size:1rem;color:var(--pd)}
#htl .trow{display:flex;gap:8px;align-items:center;padding:5px 0;border-top:1px dashed var(--line);font-size:.9rem}#htl .trow b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#htl .trow span{color:var(--muted);font-size:.78rem}
#htl .trow button{border:0;background:var(--bg);border-radius:10px;padding:6px 10px;cursor:pointer;font-size:1rem}
#htl input[type=text],#htl input[type=number],#htl input[type=search]{width:100%;padding:9px;border:1px solid var(--line);border-radius:10px;font:inherit;background:var(--card);color:var(--ink)}
#htl .tbt{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}#htl .tbt button{flex:1;min-width:140px;border:0;border-radius:12px;padding:10px;font:inherit;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--pl),var(--pd));cursor:pointer}#htl .tbt button.r{background:#dc2626}
#htl .tmsg{margin-top:6px;font-size:.85rem;color:var(--muted)}

.pjfire{background:linear-gradient(90deg,#f97316,#dc2626);border-radius:99px;padding:6px 24px;font-weight:900;font-size:clamp(1rem,2.6vh,1.8rem);color:#fff;box-shadow:0 0 28px rgba(249,115,22,.8);animation:pjfp .9s ease-in-out infinite alternate}@keyframes pjfp{to{transform:scale(1.06)}}
.tcr{display:flex;gap:6px;align-items:center;padding:4px 0;border-top:1px dashed var(--line);font-size:.85rem}.tcr b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tcr button{border:0;background:var(--bg);border-radius:10px;padding:5px 9px;cursor:pointer}
.pjon{position:fixed;left:14px;top:12px;z-index:6;background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.35);border-radius:99px;padding:6px 14px;font-weight:800;font-size:clamp(.8rem,1.6vw,1.15rem);color:#bbf7d0}.pjon.w{color:#fecaca}.pjon small{font-weight:600;opacity:.85;margin-left:6px}

/* 🏺 Amrut Kalash draw */
.kal{position:relative;width:230px;height:250px;margin:4px auto 0}.kal svg{width:100%;height:100%;transform-origin:50% 90%;filter:drop-shadow(0 10px 16px rgba(0,0,0,.4))}
.kal.pour svg{animation:ktilt 2.4s ease-in-out}@keyframes ktilt{0%{transform:rotate(0)}22%,72%{transform:rotate(-26deg)}100%{transform:rotate(0)}}
.kal .kdr{position:absolute;left:19%;top:44%;width:13px;height:18px;background:radial-gradient(circle at 35% 30%,#fff,#bae6fd 40%,#38bdf8 75%,#0369a1);border-radius:50% 50% 50% 50%/62% 62% 38% 38%;box-shadow:0 0 8px rgba(125,211,252,.9);opacity:0}
.kal.pour .kdr{animation:kfall .8s ease-in infinite}.kal .kdr:nth-child(4){animation-delay:.27s!important;left:17%}.kal .kdr:nth-child(5){animation-delay:.54s!important;left:21%}
@keyframes kfall{0%{opacity:0;transform:translate(0,0) scale(.6)}15%{opacity:1}100%{opacity:0;transform:translate(-8px,200px) scale(1)}}
.kal .kglow{position:absolute;inset:-14px;border-radius:50%;background:radial-gradient(circle,rgba(251,191,36,.5),transparent 65%);opacity:0;pointer-events:none}.kal.pour .kglow{opacity:1;animation:kgl 1.2s ease-in-out infinite alternate}@keyframes kgl{from{transform:scale(.9)}to{transform:scale(1.12)}}
.kdrop{position:relative;width:118px;height:153px;margin:8px auto 2px;opacity:0;transform:translateY(-40px) scale(.3);filter:drop-shadow(0 0 18px rgba(56,189,248,.75))}
.kdrop:not(.show) b{opacity:0}.kdrop svg{width:100%;height:100%;display:block}.kdrop b{position:absolute;left:0;right:0;top:56%;text-align:center;font-size:46px;line-height:1;color:#fff;font-weight:900;text-shadow:0 2px 6px #0c4a6e,0 0 3px #0c4a6e}
.kdrop.out{opacity:0;transform:translateY(70px) scale(.5);transition:transform .5s ease-in,opacity .45s}.kdrop.show{opacity:1;transform:none;transition:transform .8s cubic-bezier(.2,1.5,.4,1),opacity .4s}
.kcap{font-weight:800;color:var(--pd);margin-top:6px;text-align:center}
#pj .kal{width:min(40vh,320px);height:min(43vh,345px)}#pj .kdrop{width:min(19vh,150px);height:min(24.7vh,195px)}#pj .kdrop b{font-size:min(8vh,60px)}#pj .kcap{color:#fde68a}

.mbh{border-radius:12px;padding:8px 12px;margin:0 0 8px;color:#fff;text-align:left;font-weight:700}.mbh small{opacity:.85;margin-left:6px}.mbh span{display:block;font-size:.8rem;font-weight:600;opacity:.95}
.mbh.m1{background:linear-gradient(135deg,#0e7490,#2563eb)}.mbh.m2{background:linear-gradient(135deg,#b45309,#d97706)}.mbh.m3{background:linear-gradient(135deg,#6d28d9,#be185d)}
.pjmode{border-radius:99px;padding:6px 20px;font-weight:900;font-size:clamp(1rem,2.4vh,1.6rem);color:#fff;box-shadow:0 4px 14px rgba(0,0,0,.35)}.pjmode.m1{background:linear-gradient(135deg,#0e7490,#2563eb)}.pjmode.m2{background:linear-gradient(135deg,#b45309,#d97706)}.pjmode.m3{background:linear-gradient(135deg,#6d28d9,#be185d)}
.pjmode small{font-weight:600;opacity:.9;margin-left:8px;font-size:.62em}
/* winner Reveal controls sit in a side panel so the winner + score stay fully visible */
.pjbar.side{left:auto;right:max(10px,env(safe-area-inset-right,0px));top:50%;bottom:auto;transform:translateY(-50%);flex-direction:column;flex-wrap:nowrap;align-items:stretch;gap:10px;padding:10px;background:rgba(0,0,0,.35);border-radius:20px;max-width:min(230px,24vw)}
.pjbar.side button{padding:10px 14px;font-size:clamp(.78rem,1.5vh,1.05rem);border-radius:16px;line-height:1.25}
#pj .pjin:has(.pjbar:not(.side)){padding-bottom:215px}#pj .pjin:has(.pjbar:not(.side)) .bkcap{display:none}
#pj .pjin:has(.pjw){padding-bottom:96px;gap:4px}#pj .pjin:has(.pjw) .pjav{font-size:clamp(3rem,15vh,9rem)}#pj .pjin:has(.pjw) .pjname{font-size:clamp(1.8rem,8.5vh,5rem)}#pj .pjin:has(.pjw) .pjsc{font-size:clamp(1.4rem,6.5vh,3.4rem);margin-top:2px}#pj .pjin:has(.pjw) .pjfw{display:none}.pjbar.low{padding-top:8px;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px))}.pjbar.low button{padding:10px 24px;font-size:clamp(.9rem,2vh,1.2rem)}
#pj .pjin:has(.pjbar.side){padding-bottom:24px;padding-right:min(250px,26vw)}
.pjtm{width:100%;display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}.pjbar .tm{padding:8px 16px;font-size:clamp(.8rem,1.8vh,1.1rem);background:#334155}.pjbar .tm.cur{background:linear-gradient(135deg,#16a34a,#0f766e)}.pjbar .lbl{align-self:center;color:#fde68a;font-weight:800;font-size:clamp(.8rem,1.8vh,1.1rem)}
/* 📖 Divine Book draw — "સ્વામીની વાતો" */
.bk{position:relative;width:20em;max-width:100%;height:21em;margin:.4em auto 0;font-size:16px;perspective:70em;perspective-origin:50% 40%}
.bk .bkglow{position:absolute;left:50%;top:44%;width:19em;height:19em;margin:-9.5em 0 0 -9.5em;border-radius:50%;background:radial-gradient(circle,rgba(253,224,71,.55),rgba(251,146,60,.18) 45%,transparent 70%);opacity:.35;transition:opacity 1.2s}
.bk.open .bkglow{opacity:1;animation:bkpulse 2.2s ease-in-out infinite alternate}@keyframes bkpulse{from{transform:scale(.92)}to{transform:scale(1.08)}}
.bkrays{position:absolute;left:50%;top:38%;width:22em;height:22em;margin:-11em 0 0 -11em;border-radius:50%;opacity:0;transition:opacity 1s;pointer-events:none;
 background:repeating-conic-gradient(from 0deg,rgba(255,236,150,.55) 0 7deg,transparent 7deg 20deg);-webkit-mask:radial-gradient(circle,transparent 18%,#000 30%,transparent 72%);mask:radial-gradient(circle,transparent 18%,#000 30%,transparent 72%)}
.bk.beam .bkrays{opacity:1;animation:bkspin 14s linear infinite}@keyframes bkspin{to{transform:rotate(360deg)}}
.bkbook{position:absolute;left:50%;bottom:.6em;width:8.4em;height:12.55em;margin-left:-2.1em;transform-style:preserve-3d;transform:rotateX(14deg);transition:transform 1.4s cubic-bezier(.5,0,.2,1)}
.bk.open .bkbook{transform:rotateX(14deg)}
.bk:not(.open) .bkbook{animation:bkfloat 3.4s ease-in-out infinite}@keyframes bkfloat{0%,100%{transform:rotateX(14deg) translateY(0)}50%{transform:rotateX(14deg) translateY(-.5em)}}
.bkshadow{position:absolute;left:50%;bottom:-.3em;width:12em;height:1.2em;margin-left:-6em;border-radius:50%;background:radial-gradient(ellipse,rgba(0,0,0,.5),transparent 70%)}
.bkpg{position:absolute;inset:.25em .1em .25em .35em;border-radius:.1em .5em .5em .1em;background:linear-gradient(90deg,#e8d9ae,#fff8e1 12%,#fbeec6);box-shadow:inset .2em 0 .5em rgba(120,80,20,.3),.12em .12em 0 #e3cf9b,.24em .24em 0 #d4bd84,.36em .36em 0 #c3aa6c}
.bkpg.p2{transform:translateZ(.05em)}.bkpg.p3{transform:translateZ(.1em)}.bkpg.txt{transform:translateZ(.15em)}
.bkpg.txt{background:linear-gradient(90deg,#e8d9ae,#fff8e1 12%,#fbeec6)}
.bkpg.txt:before{content:"";position:absolute;inset:0;border-radius:inherit;background:repeating-linear-gradient(180deg,transparent 0 .78em,rgba(120,70,20,.3) .78em .84em) 1.1em 1.6em/5.8em 8.8em no-repeat;opacity:0;filter:blur(.35em);transition:opacity 1.8s ease-out 1.3s,filter 1.8s ease-out 1.3s}
.bk.flip .bkpg.txt:before,.bk.done .bkpg.txt:before{opacity:.28;filter:blur(0)}
.bk.done .bkpg.txt:before{transition:none}
.bkflip{transform:translateZ(.2em);position:absolute;inset:.25em .1em .25em .35em;transform-origin:left center;border-radius:.1em .5em .5em .1em;background:linear-gradient(90deg,#f1e2b4,#fff8e1);opacity:0;backface-visibility:visible}
.bk.flip .bkflip{animation:bkfl 1.7s cubic-bezier(.45,.05,.35,1) 1 both}.bk.flip .bkflip.f2{animation-delay:.7s}.bk.flip .bkflip.f3{animation-delay:1.4s}
@keyframes bkfl{0%{opacity:.95;transform:translateZ(.2em) rotateY(0)}80%{opacity:.9;transform:translateZ(.2em) rotateY(-165deg)}100%{opacity:0;transform:translateZ(.2em) rotateY(-175deg)}}
.bkcov{position:absolute;inset:0;transform:translateZ(.45em);transform-origin:left center;transform-style:preserve-3d;transition:transform 1.5s cubic-bezier(.5,0,.2,1);z-index:3}
.bk.open .bkcov{transform:translateZ(.45em) rotateY(-172deg)}
.bkfront,.bkback{position:absolute;inset:0;border-radius:.2em .6em .6em .2em;backface-visibility:hidden;-webkit-backface-visibility:hidden}

function speakQuestion(text, force){

  if(!audioOn && !force) return;

    const voices=synth.getVoices();
    const gv=voices.find(v=>v.lang&&v.lang.toLowerCase().startsWith('gu'));
    if(force && voices.length===0){ alert('આ device પર કોઈ TTS voice મળી નથી.'); return; }

    synth.speak(u);

    if(synth.speaking||synth.pending) synth.cancel();
    setTimeout(()=>{ if(synth.getVoices().length) doSpeak(); else synth.onvoiceschanged=doSpeak; }, 150);
  }catch(e){ if(force) alert('Audio error: '+e.message); }
}

function wheelSVG(numbers, rotation, highlightNumber){
  const total=Math.max(numbers.length,1), R=132,C=142,seg=360/total;
  const colors=['#7c3aed','#f59e0b','#16a34a','#0ea5e9','#e11d48','#9333ea'];
  let paths='';
  numbers.forEach((num,i)=>{
    const a0=i*seg-90, a1=a0+seg;
    const x1=C+R*Math.cos(a0*Math.PI/180), y1=C+R*Math.sin(a0*Math.PI/180);
    const x2=C+R*Math.cos(a1*Math.PI/180), y2=C+R*Math.sin(a1*Math.PI/180);
    const large=seg>180?1:0;
    const fill=colors[(num-1)%colors.length];
    const ring=num===highlightNumber?'stroke="#ffd700" stroke-width="3"':'stroke="#1f1d2e" stroke-width="1"';
    paths+=`<path d="M${C},${C} L${x1.toFixed(1)},${y1.toFixed(1)} A${R},${R} 0 ${large} 1 ${x2.toFixed(1)},${y2.toFixed(1)} Z" fill="${fill}" ${ring}/>`;
    const mid=(a0+a1)/2, lx=C+(R*0.7)*Math.cos(mid*Math.PI/180), ly=C+(R*0.7)*Math.sin(mid*Math.PI/180);
    paths+=`<text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" fill="#fff" font-size="${total>24?11:13}" font-weight="700" text-anchor="middle" dominant-baseline="middle">${num}</text>`;
  });
  return `<div style="position:relative;width:284px;margin:6px auto;">
  <div style="position:absolute;top:-5px;left:50%;transform:translateX(-50%);font-size:24px;z-index:2;">🔻</div>
  <svg id="wheelSvg" viewBox="0 0 ${2*C} ${2*C}" width="284" height="284" style="transform:rotate(${rotation}deg);will-change:transform;"><g>${paths}</g><circle cx="${C}" cy="${C}" r="23" fill="#1f1d2e" stroke="#fff" stroke-width="2"/></svg>
  </div><div class="muted" style="margin-top:2px">${numbers.length} બાકી</div>`;
}
function computeTargetRotation(pos,total){
  const seg=360/total;
  const targetMod=(((-(pos+0.5)*seg)%360)+360)%360;
  const currentMod=((wheelRotation%360)+360)%360;
  let delta=targetMod-currentMod; if(delta<0) delta+=360;
  return wheelRotation+delta+5*360;
}

const CARD_FF="'Noto Sans Gujarati','Shruti','Nirmala UI','Segoe UI',system-ui,sans-serif";
function cardBase(){ const c=document.createElement('canvas'); c.width=1080; c.height=1350; return c; }
function cardFit(g,txt,max,size,wt,min){ let s=size; g.font=wt+' '+s+'px '+CARD_FF; while(g.measureText(txt).width>max && s>(min||26)){ s-=2; g.font=wt+' '+s+'px '+CARD_FF; } return s; }
function cardRand(seed){ let s=seed; return ()=>{ s=(s*9301+49297)%233280; return s/233280; }; }
function cardFrame(g,W,H,gold,dark){
  const gg=g.createLinearGradient(0,0,W,H); gg.addColorStop(0,gold[0]); gg.addColorStop(.5,gold[1]); gg.addColorStop(1,gold[2]);
  g.strokeStyle=gg; g.lineWidth=12; g.strokeRect(28,28,W-56,H-56);
  g.lineWidth=3; g.strokeRect(54,54,W-108,H-108);
  g.fillStyle=gg; [[28,28],[W-28,28],[28,H-28],[W-28,H-28]].forEach(([x,y])=>{ g.save(); g.translate(x,y); g.rotate(Math.PI/4); g.fillRect(-16,-16,32,32); g.fillStyle=dark; g.fillRect(-7,-7,14,14); g.fillStyle=gg; g.restore(); });
}
function cardPill(g,cx,y,txt,font,fg,bg,pad){
  g.font=font; const w=g.measureText(txt).width+pad*2, h=78; const x=cx-w/2;
  g.fillStyle=bg; g.beginPath(); g.roundRect(x,y-h+22,w,h,h/2); g.fill();
  g.fillStyle=fg; g.fillText(txt,cx,y);
}
function cardAvatar(g,cx,cy,rad,emoji,ringA,ringB,fill){
  const rg=g.createLinearGradient(cx-rad,cy-rad,cx+rad,cy+rad); rg.addColorStop(0,ringA); rg.addColorStop(1,ringB);
  g.save(); g.shadowColor='rgba(0,0,0,.35)'; g.shadowBlur=40; g.shadowOffsetY=14;
  g.fillStyle=rg; g.beginPath(); g.arc(cx,cy,rad+16,0,Math.PI*2); g.fill(); g.restore();
  g.fillStyle=fill; g.beginPath(); g.arc(cx,cy,rad,0,Math.PI*2); g.fill();
  g.font=Math.round(rad*1.15)+'px '+CARD_FF; g.textAlign='center'; g.textBaseline='middle'; g.fillStyle='#000'; g.fillText(emoji,cx,cy+rad*.06); g.textBaseline='alphabetic';
}

  {

    const head=(row,labels)=>{ labels.forEach((t,i)=>{ const c=wsS.getRow(row).getCell(i+1); c.value=t; c.font={bold:true,color:{argb:'FFFFFFFF'}}; c.fill=fill('FF7C3AED'); c.alignment={horizontal:'center'}; c.border=box; }); };
    const put=(row,vals,opt={})=>{ vals.forEach((v,i)=>{ const c=wsS.getRow(row).getCell(i+1); c.value=v; c.alignment={horizontal:i===1?'left':'center',vertical:'middle'}; c.border=box; if(opt.gold){ c.fill=fill('FFFFF3B0'); c.font={bold:true}; } }); };

    const names=Object.keys(r.players); const total=names.length;

    rr=4; section('📊 કુલ આંકડા',rr); rr++;
    [['કુલ Players Join થયા',total],['કુલ Zones',zs.length],['પૂછાયેલા Questions',r.usedIdx.length+' / '+r.questions.length],
     ['સરેરાશ Final Score (બધા Players)',total?+(nets.reduce((a,b)=>a+b,0)/total).toFixed(2):0],['સૌથી વધુ Net Score',total?Math.max(...nets):0]]
      .forEach(([k,v])=>{ wsS.mergeCells('A'+rr+':C'+rr); wsS.mergeCells('D'+rr+':F'+rr); const a=wsS.getCell('A'+rr), b=wsS.getCell('D'+rr);
        a.value=k; a.font={bold:true}; a.border=box; a.fill=fill('FFF3E8FF'); b.value=v; b.alignment={horizontal:'center'}; b.font={bold:true,size:13}; b.border=box; rr++; });

    rr++; section('🏅 Zone-wise Join અને Score',rr); rr++;
    head(rr,['Rank','Zone','Players Joined','કુલ Net Score','સરેરાશ Net','Best Zone']); rr++;
    zs.forEach((o,i)=>{ put(rr,[i+1,o.zone,o.count,o.total,+o.avg.toFixed(2),(w.zone&&w.zone.toLowerCase()===o.zone.toLowerCase())?'🏆 Zone Winner':''],{gold:(w.zone&&w.zone.toLowerCase()===o.zone.toLowerCase())}); rr++; });

    rr++; section('🏆 Winners',rr); rr++;
    head(rr,['#','Category','Winner','Zone','સમય (Time Taken)','Score']); rr++;
    ['line1','line2','line3','line4','line5','full'].forEach((k,i)=>{ const n=w[k]; const pd=n?r.players[n]:null;
      put(rr,[i+1,WINNER_LABELS[k],n||'— (કોઈ નહિ)',pd?pd.zone||'':'',n?fmtDur(w[k+'_ms']):'','']); wsS.getRow(rr).getCell(2).font={bold:true}; if(n) wsS.getRow(rr).getCell(3).fill=fill('FFFFF3B0'); rr++; });
    ['top1','top2','top3'].forEach((k,i)=>{ const n=w[k]; const pd=n?r.players[n]:null; put(rr,[7+i,WINNER_LABELS[k],n||'— (કોઈ નહિ)',pd?pd.zone||'':'','',n?('Final '+w[k+'_score']):'']); wsS.getRow(rr).getCell(2).font={bold:true}; if(n) wsS.getRow(rr).getCell(3).fill=fill('FFFFF3B0'); rr++; });
    { const n=w.zonefull; put(rr,[10,WINNER_LABELS.zonefull,n||'— (કોઈ નહિ)',n||'',n?fmtDur(w.zonefull_ms):'',n?('Players '+w.zonefull_count):'']); wsS.getRow(rr).getCell(2).font={bold:true}; if(n) wsS.getRow(rr).getCell(3).fill=fill('FFFFF3B0'); rr++; }
    { const n=w.zone; put(rr,[11,WINNER_LABELS.zone,n||'— (કોઈ નહિ)',n||'','',n?('સરેરાશ '+w.zone_avg+' · '+w.zone_count+' Players'):'']); wsS.getRow(rr).getCell(2).font={bold:true}; if(n) wsS.getRow(rr).getCell(3).fill=fill('FFFFF3B0'); rr++; }

  }
  const buf=await wb.xlsx.writeBuffer();

// ===== The Epilogue: the server calculates all scores at Reveal; the host only reads r.results =====
function markCell(p,qi){ const k=Object.keys(p.marks).find(k=>p.marks[k]===qi); return k===undefined?undefined:+k; }
const EMPTY_RES={cellState:Array(25).fill('none'),pts:Array(25).fill(0),fx:Array(25).fill(''),correctRows:0,correctCount:0,wrongCount:0,fullHouse:false,base:0,hiddenPts:0,streakPts:0,gems:0,stars:0,bombs:0,personal:0,zoneBonus:0,netScore:0};
function playerResults(r,pname){ return (r.results&&r.results[pname])||EMPTY_RES; }
function fmtDur(ms){ if(ms==null) return ''; const t=Math.round(ms/1000), m=Math.floor(t/60), sc=t%60; return (m?m+' મિનિટ ':'')+sc+' સેકન્ડ'; }
function fmtTime(ts){ if(!ts) return ''; return new Date(ts).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',second:'2-digit'}); }
function winnerBannerHTML(r){
  const isTop=k=>/^top/.test(k), isZ=k=>k==='zone'||k==='zonefull';
  const w=r.winners||{}; const step=r.revealStep||0;
  if(step>=1 && step<=WINNER_ORDER.length){
    const key=WINNER_ORDER[step-1]; const name=w[key]; const isZone=isZ(key); const pd=(name&&!isZone)?r.players[name]:null;
    const ts=w[key+'_ts']; const ms=w[key+'_ms']; const tie=w[key+'_tie'];
    return `<div class="card big-winner">
    <span class="spark" style="top:10px;left:14px;animation-delay:0s">✨</span>
    <span class="spark" style="top:20px;right:18px;animation-delay:.3s">✨</span>
    <span class="spark" style="bottom:16px;left:24px;animation-delay:.6s">⭐</span>
    <span class="spark" style="bottom:20px;right:26px;animation-delay:.9s">⭐</span>
    <div class="crown">👑</div><div class="win-cat">${esc(WINNER_LABELS[key])}</div>
    <div class="win-avatar">${isZone?(name?(key==='zonefull'?'🏆':'🏅'):'❓'):(pd?avHTML(pd.avatar):'❓')}</div><div class="win-name">${name?esc(name):'કોઈ Winner નથી'}</div>
    ${pd&&pd.zone?`<div class="win-zone">${esc(pd.zone)}</div>`:''}
    ${isTop(key)&&name?`<div class="win-zone" style="font-size:1.8em;font-weight:900">🎯 Final Score: ${w[key+'_score']}</div><div class="win-zone">✅ ${w[key+'_correct']} સાચા · ❌ ${w[key+'_wrong']} ખોટા</div>`:''}
    ${key==='zone'&&name?`<div class="win-zone" style="font-size:1.6em;font-weight:900">📊 સરેરાશ Personal Score: ${w.zone_avg}</div><div class="win-zone">કુલ ${w.zone_total} · ${w.zone_count} Players</div>`:''}
    ${key==='zonefull'&&name?`<div class="win-zone" style="font-size:1.3em;font-weight:900">🎴 Zone Card સૌથી પહેલા પૂરું · ${w.zonefull_count} Players</div>`:''}
    ${ts?`<div class="win-zone" style="font-size:1.3em;font-weight:800">⏱ ${fmtDur(ms)} માં</div><div class="win-zone">🕒 ${key==='zonefull'?'Full House':'Claim'} Time: ${fmtTime(ts)}</div>`:''}
    ${tie?`<div class="win-zone" style="color:#fff3b0;font-weight:800">⚠️ Tie! Same time: ${tie.map(esc).join(', ')}</div>`:''}</div>`;
  }
  if(step>WINNER_ORDER.length){
    const colors=['#7c3aed','#f59e0b','#16a34a','#0ea5e9','#e11d48','#9333ea','#eab308','#0d9488'];
    return `<div class="card"><div class="fireworks">🎆🎉🎇👑🎊</div><h2 style="text-align:center">🏆 બધા Winners</h2><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
    ${WINNER_ORDER.map((k,i)=>{const name=w[k]; const pd=(name&&!isZ(k))?r.players[name]:null; const ts=w[k+'_ts']; const ms=w[k+'_ms'];
      return `<div class="winmini" style="background:${colors[i%colors.length]}">
      <span class="mspark" style="top:4px;left:6px;animation-delay:${(i*.15)}s">✨</span>
      <span class="mspark" style="bottom:4px;right:6px;animation-delay:${(i*.15+.4)}s">⭐</span>
      <div class="mcrown">👑</div><div class="mlbl">${esc(WINNER_LABELS[k])}</div><div class="mav">${isZ(k)?(name?(k==='zonefull'?'🏆':'🏅'):'❓'):(pd?avHTML(pd.avatar):'❓')}</div>
      <div class="mnm">${name?esc(name):'—'}</div><div class="mzn">${pd&&pd.zone?esc(pd.zone):''}</div>
      ${isTop(k)&&name?`<div class="mzn" style="font-size:1.1em;font-weight:900">🎯 Final: ${w[k+'_score']}</div>`:''}
      ${k==='zone'&&name?`<div class="mzn" style="font-size:1.1em;font-weight:900">📊 સરેરાશ: ${w.zone_avg} · 👥 ${w.zone_count}</div>`:''}
      ${ts?`<div class="mzn">⏱ ${fmtDur(ms)}</div><div class="mzn">🕒 ${fmtTime(ts)}</div>`:''}</div>`;
    }).join('')}</div></div>`;
  }
  return '';
}

 function winners(){var r=state.room,out=[];(WINNER_ORDER||[]).forEach(function(k){var d=wcData(k);if(d)out.push(d)});return out}
 function zs(r){try{return zoneStats.length>=2?zoneStats(r,function(n){return playerResults(r,n)}):zoneStats(r)}catch(e){return []}}
 function reportPages(){var r=state.room,pg=[],W=1240,H=1754,ws=winners(),Z=zs(r)||[];
  function page(){var c=document.createElement('canvas');c.width=W;c.height=H;var g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,W,H);g.fillStyle='#4c1d95';g.fillRect(0,0,W,16);g.textAlign='left';pg.push(c);return g}
  var g=page();g.fillStyle='#4c1d95';g.font='900 54px '+SERIF;g.fillText('જ્ઞાન શોધ – Event Report',80,130);g.fillStyle='#555';g.font='600 28px '+SANS;g.fillText((gameName()||'')+' · Room '+r.code+' · '+new Date().toLocaleDateString('en-IN',{day:'2-digit',month:'long',year:'numeric'}),80,180);
  var np=Object.keys(r.players||{}).length,tiles=[['👥 Players',np],['🏘 Zones',Z.length],['❓ Questions',(r.usedIdx||[]).length+'/'+(r.questions||[]).length]];
  tiles.forEach(function(t,i){var x=80+i*370;g.fillStyle='#f3e8ff';g.beginPath();g.roundRect(x,230,340,150,24);g.fill();g.fillStyle='#4c1d95';g.font='900 56px '+SANS;g.textAlign='center';g.fillText(String(t[1]),x+170,310);g.font='600 26px '+SANS;g.fillText(t[0],x+170,356);g.textAlign='left'});
  g.fillStyle='#1f1400';g.font='900 38px '+SERIF;g.fillText('🏆 Winners',80,470);var y=520;
  ws.forEach(function(d,i){if(y>H-120){g=page();y=110}g.fillStyle=i%2?'#faf5ff':'#fff';g.fillRect(80,y-40,1080,76);g.fillStyle='#1f1400';var s0=fit(g,d.label,230,30,800,SANS,18);g.font='800 '+s0+'px '+SANS;g.fillText(d.label,95,y+4);var s=fit(g,d.name,300,32,800,SANS,18);g.font='800 '+s+'px '+SANS;g.fillText(d.name,345,y+4);g.fillStyle='#555';var s2=fit(g,d.zone||'',130,24,600,SANS,16);g.font='600 '+s2+'px '+SANS;g.fillText(d.zone||'',665,y+4);var s3=fit(g,d.detail||'',350,24,600,SANS,15);g.font='600 '+s3+'px '+SANS;g.fillText(d.detail||'',810,y+4);y+=76});
  if(Z.length){if(y>H-300){g=page();y=110}else y+=40;g.fillStyle='#1f1400';g.font='900 38px '+SERIF;g.fillText('🏘 Zone-wise સરેરાશ Score',80,y);y+=50;
   Z.slice(0,40).forEach(function(z,i){if(y>H-90){g=page();y=110}g.fillStyle=i%2?'#faf5ff':'#fff';g.fillRect(80,y-36,1080,64);g.fillStyle='#1f1400';g.font='700 28px '+SANS;g.fillText((i+1)+'. '+(z.zone||z.name||''),95,y+4);g.fillStyle='#555';g.font='600 26px '+SANS;g.fillText((z.count!=null?z.count+' Players':'')+(z.avg!=null?' · સરેરાશ '+(+z.avg).toFixed(1):''),620,y+4);y+=64})}
  return pg}
 function jpeg(c){return {url:c.toDataURL('image/jpeg',.92),w:c.width,h:c.height}}
 window.CERT={
  one:function(k){return fontsReady().then(prep).then(function(){var d=wcData(k);if(!d)return;certCanvas(d).toBlob(function(b){save(b,'certificate-'+d.label.replace(/[^\w઀-૿]+/g,'_')+'-'+d.name.replace(/[^\w઀-૿]+/g,'_')+'.png')})})},
  allPdf:function(){return fontsReady().then(prep).then(function(){var ws=winners();if(!ws.length)return 0;var pgs=ws.map(function(d){return jpeg(certCanvas(d))});save(pdf(pgs,842,595),'certificates-'+state.room.code+'.pdf');return ws.length})},
  report:function(){return fontsReady().then(function(){var pgs=reportPages().map(jpeg);save(pdf(pgs,595,842),'event-report-'+state.room.code+'.pdf');return pgs.length})},
  list:winners,prep:prep,draw:function(d){return certCanvas(d)},fonts:fontsReady};
})();
</script>

<script>
/* ===== 📥 Question import (Excel / CSV / TXT) ===== */
(function(){
 var NEED=36,PER=0;
 function cv(v){ if(v==null) return ''; if(typeof v==='object'){ if(v.richText) return v.richText.map(function(x){return x.text}).join(''); if(v.text!=null) return String(v.text); if(v.result!=null) return String(v.result); if(v.hyperlink) return String(v.hyperlink); return ''; } return String(v); }
 function clean(t){ return cv(t).replace(/[\r\n\t]+/g,' ').replace(/\s{2,}/g,' ').trim(); }
 function csvRows(txt){ txt=txt.replace(/^﻿/,''); var first=txt.split(/\r?\n/)[0]||'', d=',', c={'\t':(first.match(/\t/g)||[]).length,';':(first.match(/;/g)||[]).length,',':(first.match(/,/g)||[]).length}; if(c['\t']>=c[','] && c['\t']>0) d='\t'; else if(c[';']>c[',']) d=';';
  var rows=[],row=[],cur='',q=false,i,ch; for(i=0;i<txt.length;i++){ ch=txt[i]; if(q){ if(ch=='"'){ if(txt[i+1]=='"'){cur+='"';i++} else q=false } else cur+=ch } else if(ch=='"') q=true; else if(ch==d){ row.push(cur); cur=''; } else if(ch=='\n'||ch=='\r'){ if(ch=='\r'&&txt[i+1]=='\n') i++; row.push(cur); rows.push(row); row=[]; cur=''; } else cur+=ch; }
  if(cur!==''||row.length){ row.push(cur); rows.push(row); } return rows; }
 function toLines(rows){ var out=[],bad=0,skipped=0;
  rows.forEach(function(r,ix){ var q=clean(r[0]),a=clean(r[1]),im=clean(r[2]),au=clean(r[3]),md=String(clean(r[4])||'').replace(/\D/g,'').charAt(0);
   if(!q&&!a) return;
   if(ix===0 && /^(question|q\b|prashn|પ્રશ્ન|સવાલ)/i.test(q) && /^(answer|a\b|javab|જવાબ|ઉત્તર)/i.test(a)){ skipped=1; return; }
   if(!q||!a){ bad++; return; }
   q=q.replace(/::/g,':'); out.push(q+'::'+a+(im?' [img:'+im.replace(/\s+/g,'')+']':'')+(au?' [audio:'+au.replace(/\s+/g,'')+']':'')+(/^[123]$/.test(md)?' [m:'+md+']':'')); });
  return {lines:out,bad:bad}; }
 function done(res,name){ var ta=document.getElementById('qaText'),st=document.getElementById('qaImpMsg'); if(!ta) return;
  if(!res.lines.length){ if(st){st.style.color='#b91c1c';st.textContent='❌ '+name+' માંથી કોઈ Question મળ્યો નહિ. Column A = Question, Column B = Answer હોવું જોઈએ.'} return; }
  var n=res.lines.length,w='',L=res.lines.slice(); if(PER&&n%PER===0&&n/PER<=12){ var o=[]; L.forEach(function(x,i){ if(i%PER===0) o.push('Round '+(i/PER+1)); o.push(x); }); L=o; } ta.value=L.join('\n');
  var seen={},dup=0; res.lines.forEach(function(x){ var k=x.split('::')[1].replace(/ \[(img|audio|m):[^\]]*\]/g,'').trim().toLowerCase(); if(seen[k]) dup++; seen[k]=1; }); if(dup) w+=' ⚠ '+dup+' જવાબ બે વાર આવે છે (દરેક જવાબ અલગ રાખો).';
  if(NEED&&n!==NEED) w=' ⚠ આ Game માટે '+NEED+' Questions જોઈએ (હાલ '+n+').';
  if(res.bad) w+=' ('+res.bad+' ખાલી/અધૂરી લાઇન છોડી)';
  if(st){st.style.color=w.indexOf('⚠')>=0?'#b45309':'#15803d';st.textContent='✅ '+n+' Questions લોડ થયા ('+name+').'+w+' નીચે Textbox માં ચકાસો, પછી Create Room.'} }
 window.qaImport=function(inp){ var f=inp.files&&inp.files[0]; if(!f) return; var st=document.getElementById('qaImpMsg'); if(st){st.style.color='';st.textContent='⏳ વાંચી રહ્યા છીએ…'}
  var ext=(f.name.split('.').pop()||'').toLowerCase();
  if(ext==='xlsx'){ if(typeof ExcelJS==='undefined'){ if(st) st.textContent='❌ Excel library લોડ નથી થઈ (Internet તપાસો) — CSV વાપરો.'; return; }
   f.arrayBuffer().then(function(buf){ var wb=new ExcelJS.Workbook(); return wb.xlsx.load(buf).then(function(){ var ws=wb.worksheets[0],rows=[]; if(ws) ws.eachRow({includeEmpty:false},function(row){ rows.push([row.getCell(1).value,row.getCell(2).value,row.getCell(3).value,row.getCell(4).value,row.getCell(5).value]); }); done(toLines(rows),f.name); }); }).catch(function(e){ if(st){st.style.color='#b91c1c';st.textContent='❌ Excel ખુલી નહિ: '+e.message} });
  } else {
   f.text().then(function(t){ if(/::/.test(t) && ext==='txt'){ var L=t.split(/\r?\n/).map(function(x){return x.trim()}).filter(Boolean); done({lines:L,bad:0},f.name); } else done(toLines(csvRows(t)),f.name); });
  }
  inp.value=''; };
 window.qaTemplate=function(){ if(typeof ExcelJS==='undefined'){ alert('Excel library લોડ નથી થઈ.'); return; }
  var wb=new ExcelJS.Workbook(),ws=wb.addWorksheet('Questions'); ws.columns=[{header:'Question',key:'q',width:60},{header:'Answer',key:'a',width:30},{header:'Image (વૈકલ્પિક)',key:'i',width:26},{header:'Audio (વૈકલ્પિક)',key:'u',width:26},{header:'Mode 1/2/3 (વૈકલ્પિક)',key:'m',width:22}];
  [['ભારતની રાજધાની કઈ છે?','નવી દિલ્હી','','',1],['ગુજરાતનું સૌથી મોટું શહેર કયું છે?','અમદાવાદ','q2.jpg','',2],['આ ગીત કયું છે?','વૈષ્ણવ જન','','geet.mp3',3]].forEach(function(r){ ws.addRow({q:r[0],a:r[1],i:r[2],u:r[3],m:r[4]||''}); });
  var h=ws.getRow(1); h.font={bold:true,color:{argb:'FFFFFFFF'}}; h.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FF0F766E'}}; ws.views=[{state:'frozen',ySplit:1}];
  wb.xlsx.writeBuffer().then(function(b){ var a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([b],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'})); a.download='questions-template.xlsx'; document.body.appendChild(a); a.click(); a.remove(); }); };
})();
</script>
